---
# ci.yml — "Check locally" step, automated for every push and pull request.
# Mirrors ./scripts/verify.sh: lint, unit tests, mock evals. No cloud access.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, mock evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests and evals run against SQLite with the dev operator; no secrets needed.
      DATABASE_URL: sqlite:///./ci.db
      AUTH_MODE: dev
      TELEMETRY_ADAPTER: simulator
      PYTHONPATH: backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        # Blocking only when the project has a ruff configuration; otherwise a warning,
        # so an unconfigured linter never masks a genuine test failure.
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/ruff.toml ] \
             || [ -f pyproject.toml ] || [ -f ruff.toml ]; then
            ruff check backend
          else
            ruff check backend || echo "::warning::ruff not configured for this repo - lint is non-blocking"
          fi

      - name: Unit tests
        run: cd backend && pytest -q

      - name: Mock evals (golden set, no model calls)
        run: python evals/run_cases.py --mock
