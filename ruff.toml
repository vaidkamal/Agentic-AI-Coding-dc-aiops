# Project lint config (scripts/verify.sh runs `ruff check backend evals`).
target-version = "py312"
line-length = 110
extend-exclude = ["specs", "specs_with_AI_feature", "specs_with_AI_Evals", "transcripts"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI `Depends(...)` in defaults is the framework idiom

[lint.per-file-ignores]
# Pre-existing phase-1 modules use a compact one-statement-per-line style; left as written.
"backend/app.py" = ["E401", "E701", "E702", "I001"]
"backend/auth.py" = ["E401", "E701", "E702", "I001", "B904"]
"backend/adapters/*.py" = ["E401", "E701", "E702", "I001", "B905"]
"backend/integrations/*.py" = ["E401", "E701", "E702", "I001"]
# tests/evals set sys.path before importing the code under test
"backend/tests/*.py" = ["E402"]
"evals/*.py" = ["E402"]
