[pytest]
# Canonical run is `cd backend && pytest -q`; this lets the spec's AC commands
# (`pytest -k normalise`, `pytest tests/test_ai_triage.py -k shape`) work from the repo root
# without collecting the suite twice through the `tests -> backend/tests` symlink.
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
