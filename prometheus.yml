global: { scrape_interval: 15s }
scrape_configs:
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"], labels: { rack: "A-01", zone: "A" } }]
  - job_name: pdu
    static_configs: [{ targets: ["snmp-exporter:9116"] }]
  - job_name: environment
    static_configs: [{ targets: ["env-exporter:9200"] }]
